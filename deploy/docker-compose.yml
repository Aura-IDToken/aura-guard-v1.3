services:
  aura-guard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # Use the debug-nonroot variant so that the health-check probe can call
      # busybox wget. Production bare-metal / Kubernetes deployments should
      # build without this arg (defaults to the standard :nonroot image) and
      # use native liveness/readiness probes instead.
      args:
        RUNTIME: gcr.io/distroless/cc-debian12:debug-nonroot
    image: aura-guard:1.3
    container_name: aura-guard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AURA_BIND: "0.0.0.0:8080"
      AURA_API_KEY: "${AURA_API_KEY:?AURA_API_KEY is required}"
      AURA_POLICIES_DIR: "/app/policies"
      AURA_AUDIT_LOG_PATH: "/app/logs/audit.jsonl"
      AURA_LOG: "info"
    volumes:
      - ../policies:/app/policies:ro
      - ../logs:/app/logs
    healthcheck:
      # wget is provided by busybox in the debug-nonroot image.
      # Hits the /health liveness endpoint; exits 0 when the server is up.
      test: ["CMD", "/busybox/wget", "--tries=1", "--timeout=5", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
