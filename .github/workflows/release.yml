name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - name: Build binaries
        run: cargo build --locked --release --bins
      - name: Package artifacts
        run: |
          mkdir -p dist
          tar -czf "dist/aura-guard-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            -C target/release \
            aura-guard aura-replay aura-sign-policy aura-seal
          sha256sum dist/*.tar.gz > dist/SHA256SUMS
      - name: Validate packaged artifacts
        run: |
          cd dist
          sha256sum -c SHA256SUMS
      - name: Generate build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*

  validate:
    name: Validate uploaded artifacts
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - name: Verify checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
